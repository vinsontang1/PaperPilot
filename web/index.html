<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperPilot</title>

  <!-- Tailwind CDN with typography plugin inlined via config -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:    '#f6f7f9',
            panel: '#ffffff',
            panel2:'#fbfbfd',
            border:'#e6e8ec',
            text:  '#111827',
            textSoft:'#374151',
            muted: '#6b7280',
            accent:'#4f46e5',
            accentSoft:'#eef2ff',
            warn:  '#b45309',
            warnBg:'#fef3c7',
            ok:    '#047857',
            okBg:  '#d1fae5',
            danger:'#b91c1c',
          },
          fontFamily: {
            sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','"PingFang SC"','"Microsoft YaHei"','Helvetica Neue','Arial','sans-serif'],
            mono: ['ui-monospace','SFMono-Regular','"SF Mono"','Menlo','Consolas','monospace'],
          },
          boxShadow: {
            card: '0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06)',
            pop:  '0 4px 14px rgba(15,23,42,0.10)',
            modal:'0 12px 32px rgba(15,23,42,0.18)',
          },
        },
      },
    };
  </script>

  <!-- KaTeX for $$ … $$ and $ … $ math -->
  <link rel="stylesheet" href="/web/vendor/katex/katex.min.css" />
  <script defer src="/web/vendor/katex/katex.min.js"></script>
  <script defer src="/web/vendor/katex/auto-render.min.js"></script>

  <!-- Markdown (marked global) -->
  <script src="/web/vendor/marked.min.js"></script>

  <!-- Project overrides that don't fit into Tailwind utilities -->
  <link rel="stylesheet" href="/web/css/app.css" />
</head>
<body class="bg-bg text-text font-sans antialiased">
  <div id="app" class="flex flex-col h-screen min-h-0"></div>

  <!-- Hover popup for annotation comments + lightbox / modal root -->
  <div id="hover-popup" class="hover-popup" hidden></div>
  <div id="modal-root"></div>

  <script type="module" src="/web/js/app.js"></script>
</body>
</html>
